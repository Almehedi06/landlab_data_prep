# ============================================================================
# landlab_data_prep config template. Copy it to config/base.yaml
# (git-ignored) and edit the values for your event: one event at a time.
# Every command reads that file with --config:
#   landlab-prep-pipeline --config config/base.yaml --export-final-tifs
#   landlab-prep-soil --config config/base.yaml
#   landlab-prep-hls --config config/base.yaml
# ============================================================================

# ----------------------------------------------------------------------------
# Event
# ----------------------------------------------------------------------------
aoi:
  aoi: /abs/path/to/aoi.shp

paths:
  output_dir: /abs/path/to/outputs
  cache_dir: /abs/path/to/cache           # downloads are kept here; required when any source downloads

fire:                     # read only to build remote BAER download names
  name: Example Fire
  id: ST0000000000000000000
  post_image_date: ""     # YYYYMMDD; needed only for remote dNBR

# ----------------------------------------------------------------------------
# Analysis grid: every command builds the same grid from aoi.aoi and
# target_res (the AOI's UTM zone, AOI bounds snapped outward to multiples of
# target_res). There are no per-command overrides.
# ----------------------------------------------------------------------------
raster:
  target_res: 10                  # metres
  resampling_method: bilinear     # default for continuous sources

# ----------------------------------------------------------------------------
# DEM: source is local or bmi-topography
# ----------------------------------------------------------------------------
dem:
  source: bmi-topography
  path: /abs/path/to/local_dem.tif   # used only when source: local
  # Used only when source: bmi-topography
  dem_type: USGS10m
  buffer_deg: 0.05
  api_key: ""                        # OpenTopography key; USGS_TOPO_API_KEY or OPENTOPOGRAPHY_API_KEY override it

# ----------------------------------------------------------------------------
# Burn severity, categorical SBS: source is local, remote, remote_then_local or auto
# ----------------------------------------------------------------------------
burn_severity:
  source: remote_then_local
  local:
    path: /abs/path/to/local_burn_dir
    filename: burn_severity.tif
    resampling: nearest
  remote:
    base_url: https://edcintl.cr.usgs.gov/downloads/sciweb1/shared/MTBS_Fire/data/baer/
    candidates:
      - "{base_url}{fire_name_fmt}_sbs.zip"
      - "{base_url}{fire_name_fmt}_{fire_id_fmt}_sbs.zip"
    resampling: nearest

# ----------------------------------------------------------------------------
# Continuous dNBR from the BAER "preliminary" bundle. Skipped unless enabled.
# ----------------------------------------------------------------------------
dnbr:
  enabled: false
  source: remote_then_local
  local:
    path: /abs/path/to/local_burn_dir
    filename: dnbr.tif
    resampling: bilinear
  remote:
    base_url: https://edcintl.cr.usgs.gov/downloads/sciweb1/shared/MTBS_Fire/data/baer/
    candidates:
      - "{base_url}{fire_name_fmt}_{fire_id_fmt}_{post_date_fmt}_preliminary.zip"
    resampling: bilinear

# ----------------------------------------------------------------------------
# Soil and landcover: each url is a local file or a remote URL.
# ----------------------------------------------------------------------------
feature_sources:
  rasters:
    cec7_0_cm:
      url: https://storage.googleapis.com/solus100pub/cec7_0_cm_p.tif
      resampling: bilinear
    anylithicdpt_cm:
      url: https://storage.googleapis.com/solus100pub/anylithicdpt_cm_p.tif
      resampling: bilinear
    claytotal_0_cm:
      url: https://storage.googleapis.com/solus100pub/claytotal_0_cm_p.tif
      resampling: bilinear
    ph1to1h2o_0_cm:
      url: https://storage.googleapis.com/solus100pub/ph1to1h2o_0_cm_p.tif
      resampling: bilinear
    sandtotal_0_cm:
      url: https://storage.googleapis.com/solus100pub/sandtotal_0_cm_p.tif
      resampling: bilinear
    silttotal_0_cm:
      url: https://storage.googleapis.com/solus100pub/silttotal_0_cm_p.tif
      resampling: bilinear
    dbovendry_0_cm:
      url: https://storage.googleapis.com/solus100pub/dbovendry_0_cm_p.tif
      resampling: bilinear
  landcover:
    nlcd_2021:
      url: https://www.mrlc.gov/downloads/sciweb1/shared/mrlc/data-bundles/Annual_NLCD_LndCov_2021_CU_C1V1.zip
      resampling: nearest
      unzip: true

# ----------------------------------------------------------------------------
# Remote sensing: NASA HLS vegetation indices, built by
# landlab-prep-hls; the Landlab pipeline ignores this block.
# Uncomment to enable. Every key is required except resampling, and unknown
# keys are an error. Needs EARTHDATA_TOKEN or a ~/.netrc entry for
# urs.earthdata.nasa.gov. Keep both windows in the same season.
#
# remote_sensing:
#   windows:
#     pre:  {start: 2017-06-01, end: 2017-09-30}
#     post: {start: 2018-06-01, end: 2018-09-30}
#   indices: [NBR, NDVI, NDMI]
#   cloud_max: 60          # drop whole scenes above this cloud cover percent
#   compositing: median
#   resampling: bilinear   # optional; default is raster.resampling_method
