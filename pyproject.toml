[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-data-prep"
dynamic = ["version"]
description = "AOI-based geospatial data preparation for postfire debris-flow and landslide modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "requests>=2.31",
  "rasterio>=1.3",
  "fiona>=1.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "landlab>=2.8",
  "bmi-topography>=0.5",
  "pystac-client>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
landslide-prep-pipeline = "landslide_data_prep.run_pipeline:main"
landslide-prep-soil = "landslide_data_prep.soil_data.cli_run:main"
landslide-prep-soil-fetch = "landslide_data_prep.soil_data.cli_fetch:main"
landslide-prep-soil-align = "landslide_data_prep.soil_data.cli_harmonize:main"
landslide-prep-hls = "landslide_data_prep.remote_sensing.cli_run:main"
landslide-prep-dem-difference = "landslide_data_prep.dem_difference:main"
landslide-prep-export-tifs = "landslide_data_prep.export_ascii_to_tif:main"

[tool.setuptools.dynamic]
version = {attr = "landslide_data_prep.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["landslide_data_prep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
